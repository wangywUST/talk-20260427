name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install @slidev/cli slidev-theme-dracula playwright-chromium

      - name: Build slides
        run: npx slidev build --base /${{ github.event.repository.name }}/

      - name: Install Chinese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Export PDF
        run: npx slidev export --output dist/slidev-exported.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
